services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: communex
      POSTGRES_USER: ${DATABASE_USERNAME:-communex}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the root .env file}
    ports:
      - "5432:5432"
    volumes:
      - communex_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-communex} -d communex"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://ep-cold-surf-b4l4kp91-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      DATABASE_USERNAME: ${DATABASE_USERNAME:-neondb_owner}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JWT_EXPIRATION: 3600000
      FLYWAY_ENABLED: "true"
      DDL_AUTO: update
      CORS_ALLOWED_ORIGINS: http://localhost:5173,
      COMMUNEX_AI_BASE_URL: ""
      COMMUNEX_AI_MODEL: llama3.2
      EMAIL_VERIFICATION_REQUIRED: "false"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  communex_postgres:
