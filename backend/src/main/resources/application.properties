spring.application.name=CommuneX
server.port=${PORT:8080}

# Required environment variables
spring.datasource.url=jdbc:postgresql://ep-cold-surf-b4l4kp91-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_OAMzvj3XiWZ0
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=20000
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Flyway configuration for fresh database
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://communex.blitz.cloud,communex-backend.communex.blitz.cloud,http://localhost:8080,https://communex-sage.vercel.app}
communex.ai.base-url=${COMMUNEX_AI_BASE_URL:}
# GroqCloud AI Configuration
communex.ai.provider=${COMMUNEX_AI_PROVIDER:groq}
communex.ai.groq-api-key=${GROQ_API_KEY:}
communex.ai.model=${COMMUNEX_AI_MODEL:openai/gpt-oss-20b}
communex.ai.groq-base-url=${COMMUNEX_AI_GROQ_BASE_URL:https://api.groq.com/openai/v1}
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}

# Email delivery through a private Google Apps Script HTTPS relay
communex.email-relay.url=${EMAIL_RELAY_URL:}
communex.email-relay.secret=${EMAIL_RELAY_SECRET:}
communex.frontend-url=${FRONTEND_URL:http://localhost:5173}
communex.auth.email-verification-required=${EMAIL_VERIFICATION_REQUIRED:false}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-post-size=10MB
server.tomcat.max-swallow-size=10MB
