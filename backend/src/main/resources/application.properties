spring.application.name=CommuneX
server.port=${PORT:8080}

# Required environment variables
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=20000
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Flyway configuration for fresh database
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
communex.ai.base-url=${COMMUNEX_AI_BASE_URL:}
communex.ai.model=${COMMUNEX_AI_MODEL:llama3.2}

server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}

# Email delivery through a private Google Apps Script HTTPS relay
communex.email-relay.url=${EMAIL_RELAY_URL:}
communex.email-relay.secret=${EMAIL_RELAY_SECRET:}
communex.frontend-url=${FRONTEND_URL:http://localhost:5173}
communex.auth.email-verification-required=${EMAIL_VERIFICATION_REQUIRED:false}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-post-size=10MB
server.tomcat.max-swallow-size=10MB
